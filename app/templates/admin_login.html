{% extends "base.html" %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-slate-900/90 backdrop-blur-xl p-8 sm:p-10 rounded-3xl border border-slate-800 shadow-2xl relative overflow-hidden">
        
        <!-- Glow accent -->
        <div class="absolute -top-24 -right-24 w-48 h-48 bg-amber-500/10 rounded-full blur-2xl pointer-events-none"></div>

        <!-- Header -->
        <div class="text-center space-y-2">
            <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-amber-400 via-amber-500 to-amber-600 text-slate-950 flex items-center justify-center text-2xl font-black mx-auto shadow-xl shadow-amber-500/25">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h2 class="text-2xl font-black text-white tracking-tight">Đăng Nhập Quản Trị Viên</h2>
            <p class="text-xs text-slate-400">Khu vực bảo mật dành riêng cho ban quản lý <strong>Kính Mắt Kim Chi</strong></p>
        </div>

        <!-- Error Alert -->
        {% if error_message %}
            <div class="p-3.5 rounded-2xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-semibold flex items-center gap-2.5">
                <i class="fa-solid fa-circle-exclamation text-base flex-shrink-0"></i>
                <span>{{ error_message }}</span>
            </div>
        {% endif %}

        <!-- Login Form -->
        <form action="/admin/login" method="POST" class="space-y-4 text-xs">
            <div>
                <label class="block font-semibold text-slate-300 mb-1.5">Tên đăng nhập / Tài khoản</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-user"></i>
                    </span>
                    <input type="text" 
                           name="username" 
                           required 
                           autocomplete="username"
                           placeholder="Nhập tên tài khoản..." 
                           class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-10 pr-3.5 py-3 text-sm text-white focus:outline-none focus:border-amber-400 transition">
                </div>
            </div>

            <div>
                <label class="block font-semibold text-slate-300 mb-1.5">Mật khẩu bảo mật</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                        <i class="fa-solid fa-lock"></i>
                    </span>
                    <input type="password" 
                           name="password" 
                           required 
                           autocomplete="current-password"
                           placeholder="••••••••" 
                           class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-10 pr-3.5 py-3 text-sm text-white focus:outline-none focus:border-amber-400 transition">
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" 
                        class="w-full py-3.5 rounded-2xl bg-gradient-to-r from-amber-400 via-amber-500 to-amber-600 hover:from-amber-300 text-slate-950 font-black text-sm shadow-xl shadow-amber-500/25 transition transform active:scale-98 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Xác Thực & Vào Quản Trị</span>
                </button>
            </div>
        </form>

    </div>
</div>
{% endblock %}
