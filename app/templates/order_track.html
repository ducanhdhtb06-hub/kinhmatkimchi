{% extends "base.html" %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6" x-data="trackOrderApp()">

    <!-- Header -->
    <div class="text-center space-y-2">
        <h1 class="text-2xl sm:text-3xl font-black text-white">Tra Cứu Trạng Thái Đơn Hàng</h1>
        <p class="text-xs text-slate-400">Nhập mã đơn hàng của bạn (ví dụ: <strong class="text-amber-400">OPT-260901-A1B2</strong>) để theo dõi tiến độ mài tròng và vận chuyển.</p>
    </div>

    <!-- Search Input Box -->
    <div class="bg-slate-900/90 rounded-2xl border border-slate-800 p-4 shadow-xl flex items-center gap-3">
        <div class="relative flex-1">
            <i class="fa-solid fa-barcode absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input type="text" x-model="orderCode" @keyup.enter="searchOrder()" placeholder="Nhập mã đơn hàng (OPT-...)" class="w-full bg-slate-950 border border-slate-700 rounded-xl pl-9 pr-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-amber-400 uppercase">
        </div>
        <button @click="searchOrder()" :disabled="isLoading" class="px-6 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 disabled:opacity-50 text-slate-950 font-bold text-xs shadow-md transition flex items-center gap-1.5">
            <i class="fa-solid fa-magnifying-glass" x-show="!isLoading"></i>
            <i class="fa-solid fa-spinner fa-spin" x-show="isLoading"></i>
            <span x-text="isLoading ? 'Đang tìm...' : 'Tra Cứu'"></span>
        </button>
    </div>

    <!-- Order Result Card -->
    <div x-show="orderData" class="bg-slate-900/90 rounded-3xl border border-slate-800 p-6 shadow-2xl space-y-6" style="display: none;">
        
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-800 pb-4">
            <div>
                <span class="text-xs text-slate-400 font-medium">Mã đơn hàng:</span>
                <div class="text-xl font-black text-amber-400" x-text="orderData?.order_code"></div>
                <div class="text-[11px] text-slate-400 mt-0.5">Đặt lúc: <span x-text="orderData?.created_at"></span></div>
            </div>
            <div class="text-right">
                <span class="inline-block px-3 py-1 rounded-full text-xs font-black"
                      :class="orderData?.order_status === 'Hoàn tất' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/30' : orderData?.order_status === 'Đang mài tròng' ? 'bg-blue-500/10 text-blue-400 border border-blue-500/30' : 'bg-amber-500/10 text-amber-400 border border-amber-500/30'"
                      x-text="orderData?.order_status"></span>
                <div class="text-[11px] text-slate-400 mt-1" x-text="'Thanh toán: ' + orderData?.payment_status"></div>
            </div>
        </div>

        <!-- Items in Order -->
        <div class="space-y-3">
            <h3 class="text-xs font-bold text-white uppercase tracking-wider">Sản phẩm & Thông số cắt tròng</h3>
            
            <template x-for="item in orderData?.items || []" :key="item.id">
                <div class="p-4 rounded-2xl bg-slate-950 border border-slate-800 space-y-3 text-xs">
                    <div class="flex items-center justify-between">
                        <div class="font-extrabold text-white text-sm" x-text="item.frame_name"></div>
                        <div class="font-black text-amber-400" x-text="formatCurrency(item.frame_price + item.lens_price)"></div>
                    </div>
                    <div class="text-[11px] text-slate-300">🔍 Loại tròng: <strong class="text-teal-400" x-text="item.lens_name"></strong></div>
                    
                    <div class="p-2.5 rounded-xl bg-slate-900 border border-slate-800/80 text-[11px] space-y-1 text-slate-400">
                        <div>Mắt Phải (OD): <strong class="text-slate-200" x-text="item.right_eye"></strong></div>
                        <div>Mắt Trái (OS): <strong class="text-slate-200" x-text="item.left_eye"></strong></div>
                        <div>Khoảng cách đồng tử (PD): <strong class="text-slate-200" x-text="item.pd"></strong></div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Shipping summary -->
        <div class="pt-4 border-t border-slate-800 text-xs space-y-1 text-slate-400">
            <div>Người nhận: <strong class="text-white" x-text="orderData?.customer_name + ' (' + orderData?.phone + ')'"></strong></div>
            <div>Địa chỉ: <strong class="text-white" x-text="orderData?.shipping_address"></strong></div>
        </div>

    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
    function trackOrderApp() {
        return {
            orderCode: '',
            isLoading: false,
            orderData: null,

            formatCurrency(val) {
                return new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(val);
            },

            async searchOrder() {
                if (!this.orderCode.trim()) {
                    Swal.fire('Thiếu mã đơn', 'Vui lòng nhập mã đơn hàng của bạn', 'warning');
                    return;
                }

                this.isLoading = true;
                this.orderData = null;

                try {
                    const res = await fetch(`/api/orders/${this.orderCode.trim().toUpperCase()}`);
                    const data = await res.json();
                    this.isLoading = false;

                    if (res.ok) {
                        this.orderData = data;
                    } else {
                        Swal.fire('Không tìm thấy', data.detail || 'Mã đơn hàng không chính xác', 'error');
                    }
                } catch (e) {
                    this.isLoading = false;
                    Swal.fire('Lỗi kết nối', 'Không thể kết nối máy chủ', 'error');
                }
            }
        }
    }
</script>
{% endblock %}
