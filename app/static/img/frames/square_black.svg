<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280">
  <defs>
    <linearGradient id="blackGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d3748" />
      <stop offset="50%" stop-color="#1a202c" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Left Rim -->
  <rect x="70" y="40" width="280" height="190" rx="35" fill="none" stroke="url(#blackGradient)" stroke-width="22" filter="url(#shadow)"/>
  <rect x="75" y="45" width="270" height="180" rx="30" fill="rgba(226, 232, 240, 0.08)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  
  <!-- Right Rim -->
  <rect x="450" y="40" width="280" height="190" rx="35" fill="none" stroke="url(#blackGradient)" stroke-width="22" filter="url(#shadow)"/>
  <rect x="455" y="45" width="270" height="180" rx="30" fill="rgba(226, 232, 240, 0.08)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  
  <!-- Bridge -->
  <path d="M 350 95 Q 400 80 450 95" fill="none" stroke="url(#blackGradient)" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Left Temple Hinges -->
  <path d="M 70 70 L 20 60" fill="none" stroke="url(#blackGradient)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="70" cy="70" r="4" fill="#cbd5e1" />
  
  <!-- Right Temple Hinges -->
  <path d="M 730 70 L 780 60" fill="none" stroke="url(#blackGradient)" stroke-width="18" stroke-linecap="round"/>
  <circle cx="730" cy="70" r="4" fill="#cbd5e1" />
  
  <!-- Lens Reflection Highlight -->
  <path d="M 90 70 Q 180 55 240 70" stroke="rgba(255, 255, 255, 0.45)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 470 70 Q 560 55 620 70" stroke="rgba(255, 255, 255, 0.45)" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
