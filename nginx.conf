# ==============================================================================
# CẤU HÌNH NGINX REVERSE PROXY CHO KÍNH MẮT KIM CHI (2 TÊN MIỀN RIÊNG BIỆT)
# ==============================================================================

# 1. TÊN MIỀN KHÁCH HÀNG: https://kinhmatkimchi.vn
server {
    listen 80;
    server_name kinhmatkimchi.vn www.kinhmatkimchi.vn;

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. TÊN MIỀN QUẢN TRỊ VIÊN (MÁY CHỦ): https://admin.kinhmatkimchi.vn
server {
    listen 80;
    server_name admin.kinhmatkimchi.vn;

    client_max_body_size 25M;

    # Tự động chuyển thẳng về trang /admin
    location = / {
        return 301 /admin;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
